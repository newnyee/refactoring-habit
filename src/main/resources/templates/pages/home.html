<th:block lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layouts/basic-layout :: basic-layout (~{::head}, ~{::title}, ~{::section})}">
  <head>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/product/product-card.css}">
    <script th:src="@{/js/home.js}"></script>
    <script th:src="@{/js/member/common/product-card.js}"></script>
  </head>

  <title>해빗(habit) : 세상 모든 취미 여가의 시작</title>

  <section><!-- 본문 시작 -->
    <div class="Home">
      <div class="Home_wrapper">
        <!--베너-->
        <div class="Home_banner">
          <div class="Home_slider">
            <div id="slides">
              <div id="overflow" class="swiper-container">
                <div class="inner swiper-wrapper">
                  <a>
                    <div data-index="0" class="slide slide_0 swiper-slide" id="slide0">
                      <div class="slide-content">
                        <h2>Slide0</h2>
                        <p><img src="/img/topban4.png"></p>
                      </div>
                    </div>
                  </a>
                  <a>
                    <div data-index="1" class="slide slide_1 swiper-slide" id="slide1">
                      <div class="slide-content">
                        <h2>Slide1</h2>
                        <p><img src="/img/topban.png"></p>
                      </div>
                    </div>
                  </a>
                  <a>
                    <div data-index="2" class="slide slide_2 swiper-slide" id="slide2">
                      <div class="slide-content">
                        <h2>Slide2</h2>
                        <p><img src="/img/topban5.png"></p>
                      </div>
                    </div>
                  </a>
                  <a>
                    <div data-index="3" class="slide slide_3 swiper-slide" id="slide3">
                      <div class="slide-content">
                        <h2>Slide3</h2>
                        <p><img src="/img/topban3.png"></p>
                      </div>
                    </div>
                  </a>
                  <a>
                    <div data-index="4" class="slide slide_4 swiper-slide" id="slide4">
                      <div class="slide-content">
                        <h2>Slide4</h2>
                        <p><img src="/img/topban4.png"></p>
                      </div>
                    </div>
                  </a>
                  <a>
                    <div data-index="5" class="slide slide_5 swiper-slide" id="slide5">
                      <div class="slide-content">
                        <h2>Slide5</h2>
                        <p><img src="/img/topban2.png"></p>
                      </div>
                    </div>
                  </a>
                </div>
              </div>
            </div>
            <p class="controller">
              <!-- &lang: 왼쪽 방향 화살표&rang: 오른쪽 방향 화살표 -->
              <span class="prev">&lang;</span>
              <span class="next">&rang;</span>
            </p>
          </div>
        </div>
        <!--배너끝-->
        <!--인기 목록-->
        <div class="home-product-recommend">
          <div class="home-product-recommend-title-wrapper">
            <div class="home-product-recommend-title">
              <h2>인기 만점 해빗 💜</h2>
            </div>
            <span class="link-view-all see-more-popular-products">전체보기</span>
          </div>
          <div class="card-product-list-wrapper popular-product">
          </div>
        </div>
        <!--신규 목록-->
        <div class="home-product-recommend">
          <div class="home-product-recommend-title-wrapper">
            <div class="home-product-recommend-title">
              <h2>신규 해빗 🌟</h2>
            </div>
            <span class="link-view-all see-more-new-products">전체보기</span>
          </div>
          <div class="card-product-list-wrapper new-product">
          </div>
        </div>
        <!--호스트 지원 배너-->
        <div class="Home_smallBanner">
          <a href="/host/join"><img src="../../img/host.png" alt="호스트 지원 배너"></a>
        </div>
      </div>
    </div>
    <!-- 본문 끝-->
  </section>
</th:block>
